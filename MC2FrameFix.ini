; MC2FrameFix - fixed-timestep physics and interpolation for Midnight Club II
[MC2FrameFix]
; 1 = on, 0 = game runs exactly like vanilla
enabled=1

; Physics/simulation rate. Physics behaves identically at any fps for a given
; value. 30 = the rate the game was tuned for (console). 60 = original PC feel
; on a 60 Hz monitor. With interpolation on, frames are smooth either way.
; Range 25-1000 (the game clamps a step to 0.04 s).
simHz=30

; Max simulation steps per frame (prevents a slow-motion spiral on a slow PC)
maxStepsPerFrame=8

; Frame limiter, 0 = off (use vsync). Set to your refresh rate without vsync.
fpsLimit=0

; Draw frames between simulation steps (smooth motion above simHz)
interpolate=1
; Blend the camera too
interpolateCamera=1
; Move car / traffic parts (wheels, shadows) with the blended body
interpolateModels=1
; Ambient traffic
interpolateTraffic=1
; Every active physics object (cars, opponents, knocked props)
interpolatePhysics=1

; A step longer than this (metres) or turning more than this (degrees) is
; treated as a teleport/reset and drawn unblended
maxStepDistance=12
maxStepAngle=60
; Camera turning more than this per step counts as a cut (look back, switch)
maxCameraAngle=45

; Log file (MC2FrameFix.log) and how often stats are written, in seconds
log=1
statsSeconds=10
