; MC2FrameFix - fixed-timestep physics and interpolation for Midnight Club II
[MC2FrameFix]
; 1 = on, 0 = game runs exactly like vanilla
enabled=1

; Physics/simulation rate. Physics behaves identically at any fps for a given
; value. 30 = the rate the game was tuned for (console). 60 = original PC feel
; on a 60 Hz monitor. With interpolation on, frames are smooth either way.
; Range 25-1000 (the game clamps a step to 0.04 s).
simHz=30

; Max simulation steps per frame (prevents a slow-motion spiral on a slow PC)
maxStepsPerFrame=8

; Frame limiter, 0 = off. Use it with vsync OFF, set to your refresh rate.
; With vsync on, leave it at 0: the limiter and vsync fight and frames stutter.
fpsLimit=0

; Draw frames between simulation steps (smooth motion above simHz)
interpolate=1
; Blend the camera too
interpolateCamera=1
; Move car / traffic parts (wheels, shadows) with the blended body
interpolateModels=1
; Ambient traffic
interpolateTraffic=1
; Every active physics object (cars, opponents, knocked props)
interpolatePhysics=1
; Pedestrians
interpolatePeds=1
; Light glows (tail/head lights) follow the blended car
interpolateGlows=1

; A step longer than this (metres) or turning more than this (degrees) is
; treated as a teleport/reset and drawn unblended
maxStepDistance=12
maxStepAngle=60
; Camera turning more than this per step counts as a cut (look back, switch)
maxCameraAngle=45

; Open audio streams (city ambience, voices) on a worker thread. The game
; opens them on the main thread and each cold open stalls a frame ~100 ms.
asyncStreams=1

; Fix a crash on exit (the game frees its debug font twice)
fixExitCrash=1

; Seconds to hold the Doppler pitch after a camera switch. The game derives
; Doppler from the camera's movement, and the switch swoop makes engine sounds
; warble (scratching). 0 = original behaviour.
dopplerHoldOnSwitch=0.5

; Updates the listener keeps its last position after a camera cut. The game
; hands the new camera to the sound before it has moved, the engine voices
; fall silent and restart from the beginning (audio cut-off). 0 = original.
fixCameraCutAudio=2

; 1 = the camera button cuts straight to the next camera instead of flying
; there through the car (the game does that already for the bumper camera)
instantCameraSwitch=0

; Diagnostic: time every Miles / DirectMusic call and log what stalls frames
profileAudio=0

; Diagnostic: log which sounds are started / stopped around camera switches
traceCameraAudio=0

; Log file (MC2FrameFix.log) and how often stats are written, in seconds
log=1
statsSeconds=10
