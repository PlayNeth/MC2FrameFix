[FixedTick]
; 1 = on, 0 = off (game behaves exactly like vanilla)
Enabled=1

; Physics/game simulation rate in Hz. Physics behaves identically at any fps
; for a given SimHz.
;   30  = console-tuned physics, but the picture only changes 30x per second
;   60  = original PC behaviour on a 60 Hz monitor (recommended)
;   120/144/240 = smooth on high-refresh screens, physics fixed at that rate
; For the smoothest result keep your fps <= SimHz (use FPSLimit below).
SimHz=60

; Max simulation steps per rendered frame (stops a slow-motion death spiral
; if the PC can't keep up). 8 is plenty.
MaxStepsPerFrame=8

; Optional built-in frame cap (0 = off). Example: SimHz=60 + FPSLimit=60.
FPSLimit=0

; Writes mc2_fixedtick.log next to the game (shows if hooks installed)
Log=1
